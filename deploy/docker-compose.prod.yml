services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arkena_core
      POSTGRES_USER: arkena
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkena -d arkena_core"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: ${ARKENA_IMAGE:-ghcr.io/jupi-z/arkena-core:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVICE_NAME: Arkena Core
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_ACCESS_SECRET_FILE: /run/secrets/jwt_access_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      JWT_RESET_SECRET_FILE: /run/secrets/jwt_reset_secret
      METRICS_ENABLED: "true"
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
      ENABLE_OPENAPI_DOCS: ${ENABLE_OPENAPI_DOCS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-2mb}
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: ${GRACEFUL_SHUTDOWN_TIMEOUT_MS:-10000}
      READINESS_DB_TIMEOUT_MS: ${READINESS_DB_TIMEOUT_MS:-2000}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-10485760}
      DEFAULT_SUPER_ADMIN_EMAIL: ${DEFAULT_SUPER_ADMIN_EMAIL:?DEFAULT_SUPER_ADMIN_EMAIL is required}
      DEFAULT_SUPER_ADMIN_PASSWORD_FILE: /run/secrets/default_super_admin_password
      DEFAULT_SUPER_ADMIN_FIRST_NAME: ${DEFAULT_SUPER_ADMIN_FIRST_NAME:-Super}
      DEFAULT_SUPER_ADMIN_LAST_NAME: ${DEFAULT_SUPER_ADMIN_LAST_NAME:-Admin}
      DEFAULT_SUPER_ADMIN_PHONE: ${DEFAULT_SUPER_ADMIN_PHONE:-+0000000000}
    secrets:
      - database_url
      - jwt_access_secret
      - jwt_refresh_secret
      - jwt_reset_secret
      - metrics_bearer_token
      - default_super_admin_password
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads_data:/app/uploads
    command: sh -c "sh scripts/docker-entrypoint.sh sh -c 'node scripts/validate-production-env.mjs && npm run prisma:migrate:deploy && node dist/src/server.js'"

secrets:
  postgres_password:
    file: ../secrets/postgres_password.txt
  database_url:
    file: ../secrets/database_url.txt
  jwt_access_secret:
    file: ../secrets/jwt_access_secret.txt
  jwt_refresh_secret:
    file: ../secrets/jwt_refresh_secret.txt
  jwt_reset_secret:
    file: ../secrets/jwt_reset_secret.txt
  metrics_bearer_token:
    file: ../secrets/metrics_bearer_token.txt
  default_super_admin_password:
    file: ../secrets/default_super_admin_password.txt

volumes:
  postgres_data:
  uploads_data:
