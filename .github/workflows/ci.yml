name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Validate production environment contract
        run: npm run ops:validate-env
        env:
          DATABASE_URL: postgresql://arkena:secure-postgres-password@db:5432/arkena_core?schema=public
          JWT_ACCESS_SECRET: ci-access-secret-with-more-than-thirty-two-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-with-more-than-thirty-two-characters
          JWT_RESET_SECRET: ci-reset-secret-with-more-than-thirty-two-characters
          METRICS_BEARER_TOKEN: ci-metrics-token-with-more-than-thirty-two-characters
          DEFAULT_SUPER_ADMIN_EMAIL: admin@example.com
          DEFAULT_SUPER_ADMIN_PASSWORD: ci-admin-password-with-more-than-twelve-chars

  docker-compose:
    runs-on: ubuntu-latest
    needs: test
    env:
      API_PORT: 3100
      API_BASE_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local env
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS "$API_BASE_URL/health/ready"; then
              exit 0
            fi
            echo "Waiting for API readiness ($attempt/90)"
            sleep 2
          done
          echo "API did not become ready in time"
          docker compose ps
          docker compose logs
          exit 1

      - name: Verify docs
        run: curl -fsS "$API_BASE_URL/docs/" > /dev/null

      - name: Verify metrics
        run: curl -fsS "$API_BASE_URL/metrics" | grep arkena_http_requests_total

      - name: Run backup and restore drill
        run: |
          mkdir -p backups
          sh scripts/backup-postgres.sh
          latest_backup="$(find backups -maxdepth 1 -type f -name '*.dump' | sort | tail -n 1)"
          docker compose stop api
          ALLOW_RESTORE=true sh scripts/restore-postgres.sh "$latest_backup"
          docker compose up -d api
          for attempt in $(seq 1 30); do
            if curl -fsS "$API_BASE_URL/health/ready"; then
              exit 0
            fi
            echo "Waiting for API readiness after restore ($attempt/30)"
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Run lightweight load check
        run: npm run test:load
        env:
          LOAD_TEST_BASE_URL: ${{ env.API_BASE_URL }}
          LOAD_TEST_PATH: /health/ready
          LOAD_TEST_DURATION_SECONDS: 5
          LOAD_TEST_CONCURRENCY: 4
          LOAD_TEST_MAX_P95_MS: 1000
          LOAD_TEST_MAX_ERROR_RATE: 0

      - name: Run release E2E
        run: npm run test:e2e
        env:
          RUN_RELEASE_E2E: true
          E2E_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
