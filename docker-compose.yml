services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arkena_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arkena_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/arkena_core?schema=public
      PORT: 3000
      JWT_ACCESS_SECRET: dev-access-secret-arkena-core-0123456789
      JWT_REFRESH_SECRET: dev-refresh-secret-arkena-core-0123456789
      JWT_RESET_SECRET: dev-reset-secret-arkena-core-0123456789
      DEFAULT_SUPER_ADMIN_EMAIL: admin@arkena.local
      DEFAULT_SUPER_ADMIN_PASSWORD: ChangeMe123!ChangeMe123!
      DEFAULT_SUPER_ADMIN_FIRST_NAME: Super
      DEFAULT_SUPER_ADMIN_LAST_NAME: Admin
      DEFAULT_SUPER_ADMIN_PHONE: +0000000000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/src/server.js"

volumes:
  postgres_data:
