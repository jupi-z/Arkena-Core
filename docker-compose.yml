services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arkena_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arkena_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/arkena_core?schema=public
      PORT: 3000
      SERVICE_NAME: Arkena Core
      SERVICE_VERSION: 1.0.0
      LOG_LEVEL: info
      JWT_ACCESS_SECRET: dev-access-secret-arkena-core-0123456789
      JWT_REFRESH_SECRET: dev-refresh-secret-arkena-core-0123456789
      JWT_RESET_SECRET: dev-reset-secret-arkena-core-0123456789
      TRUST_PROXY: 1
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 300
      BODY_SIZE_LIMIT: 2mb
      ENABLE_OPENAPI_DOCS: true
      GRACEFUL_SHUTDOWN_TIMEOUT_MS: 10000
      READINESS_DB_TIMEOUT_MS: 2000
      DEFAULT_SUPER_ADMIN_EMAIL: admin@arkena.local
      DEFAULT_SUPER_ADMIN_PASSWORD: ChangeMe123!
      DEFAULT_SUPER_ADMIN_FIRST_NAME: Super
      DEFAULT_SUPER_ADMIN_LAST_NAME: Admin
      DEFAULT_SUPER_ADMIN_PHONE: +0000000000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./uploads:/app/uploads
    command: sh -c "npm run prisma:migrate:deploy && npm run prisma:seed && node dist/src/server.js"

volumes:
  postgres_data:
